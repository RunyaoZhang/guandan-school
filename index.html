 background:var(--green); color:#f7f3e8; border-radius:8px;}

<div class="wrap">
<header class="top">
  <h1>掼蛋学堂<span class="seal">实战教学</span></h1>
  <p>两副牌 · 四人对战 · 从2打到A —— 先看情景，再选出牌，答完立刻告诉你为什么</p>
</header>

  <button data-p="scn" class="on">情景实战</button>
  <button data-p="koujue">实战口诀</button>
</nav>
<section class="panel on" id="p-scn">
  <div class="chips" id="catChips"></div>
  <div class="legend">读解析时分两层看：<b>规则</b>是硬性的（牌型合不合法、大小关系）；<b>建议</b>是常见打法，结合记牌和局势判断，不是每次都对的铁律。</div>
  <div class="progress">
    <span id="progText">已答 0/20</span>
    <div class="bar"><i id="progBar"></i></div>
    <button id="resetBtn">重置</button>
  </div>
  <div id="scnList"></div>
</section>
<section class="panel" id="p-koujue"></section>
<div class="foot-note">题目按官方比赛规则与常见实战打法编写，级牌统一按「打2」举例。<br>规则会因地方玩法略有差异，记住大逻辑最重要。</div>
</div>
<script>
"use strict";
var RANK_ORDER = {"3":3,"4":4,"5":5,"6":6,"7":7,"8":8,"9":9,"10":10,"J":11,"Q":12,"K":13,"A":14,"2":15,"小王":16,"大王":17};
function parseCard(s){
  var wild = s.charAt(s.length-1) === "※";
  if(wild) s = s.slice(0,-1);
  if(s==="大王"||s==="小王") return {rank:s, joker:true, wild:false};
  return {suit:s.charAt(0), rank:s.slice(1), joker:false, wild:wild};
}
function cardHTML(c){
  if(c.joker) return '<span class="card joker"><span class="r">'+c.rank+'</span><span class="s">王</span></span>';
  var red = (c.suit==="♥"||c.suit==="♦");
  return '<span class="card '+(red?"red":"black")+(c.wild?" wild":"")+'"><span class="r">'+c.rank+'</span><span class="s">'+c.suit+'</span></span>';
}
function handHTML(hand){
  var cs = hand.map(parseCard).sort(function(a,b){
    var d=(RANK_ORDER[a.rank]||0)-(RANK_ORDER[b.rank]||0); if(d) return d;
    return String(a.suit||"").localeCompare(String(b.suit||""));
  });
  return '<div class="hand">'+cs.map(cardHTML).join("")+"</div>";
}
</script>

{id:11, cat:"残局", title:"对手剩4张：这枪打不得",
 bg:"对手B报牌剩 4 张。上一圈没人接牌，现在轮到你领出，你手里有四个8的炸弹。",

 answer:1,
 why:"<b>规则上</b>：领出时两手都合法。注意掼蛋里没有「三带一」这种牌型，能带牌走的是三带二（要 5 张）。<b>建议上</b>：对手剩 4 张，最危险的是<b>四张炸弹</b>——他很可能等你出牌就炸，你先炸正中下怀（你的炸弹比他小就是白给）。所以别主动交炸弹。打单张而不打对子：4 张还可能是<b>两对</b>，你出对子正好喂他两手走完；打单张不喂对子，是更稳的试探。但这只是常见打法——记牌确定他没炸时，炸了拿牌权也没错。",
 tip:"剩4张慎炸加打单"},
{id:12, cat:"残局", title:"对手剩6张：打三张施压",

{id:14, cat:"残局", title:"对手剩9张：别急着交大牌",

{id:15, cat:"残局", title:"自己剩3张：顺序决定生死",

{id:16, cat:"特殊", title:"接风：队友跑了，谁接着打？",

 why:"这叫「接风」：某人出完最后一手牌且无人要牌，下一轮出牌权归他的对家。所以队友头游之后，你直接获得出牌权——这也是配合的意义：队友跑了，你接着打，一鼓作气争二游。",

{id:17, cat:"特殊", title:"进贡：你交哪一张？",

 why:"进贡规则：进贡「除红桃级牌之外」最大的牌。红桃2是逢人配（万能牌），规则明确不用进贡——这是给输家的唯一保护。所以进贡大王，留下红桃2这个万能牌，下局翻身就靠它。",

{id:18, cat:"特殊", title:"抗贡：双王在手还交贡吗？",

 tip:"双王可抗贡"},
{id:19, cat:"特殊", title:"升级：这局升几级？",
 bg:"本局结束：你头游，队友三游（对手A二游、对手B末游）。你们现在打2，下局打几？",

{id:20, cat:"特殊", title:"报牌：对手6张没报牌怎么办？",

{id:22, cat:"中盘", title:"顺子枢纽：小顺子敢出吗？",
 bg:"中盘。你数了数牌面：5 已经出了 6 张，10 出了 5 张，K 出了 6 张（两副牌每种点数共 8 张）。你手里有个小顺子 3-7。",

 tip:"记5/10/K枢纽"},
{id:23, cat:"中盘", title:"拆牌型：出单8破他的顺子",
 bg:"上半场对手A用顺子 7-J 一波走掉 5 张，说明他手里顺子多、爱走顺子。现在中盘，轮到你领出，你手里有单张8。",
 table:"对手A上半场用顺子7-J走掉5张。现在轮到你领出。",
 hand:["♠8","♣3","♦Q","♥K","♣6","♥6","♠J"],

  {label:"出单张 ♣3", play:["♣3"]},
  {label:"出对66", play:["♣6","♥6"]}],
 answer:0,
 why:"你出单张 8，不是为了压他，而是「拆他的牌」。8 被你打出去了，他以后再想组顺子（比如 6-10、7-J），手里没 8，就得拆别的牌来补——比如拆对子。他的对子越拆越少，队友的对子就越硬。这叫拆牌型：不跟他硬碰硬，让他以后的牌都难组。一张小小的 8，能废他一整手的顺子。",
 tip:"出牌拆对手牌型"},
{id:24, cat:"残局", title:"让头游：这炸弹为队友而炸",
 bg:"残局。队友报剩 2 张（你判断是一对），下轮很可能直接走完。对手A剩 5 张，刚出了三带二 777带55。你手里有四个6的炸弹，但还有 8 张牌，自己基本跑不了。",

 answer:0,
 why:"你 8 张牌，这局基本跑不了头游了。但队友只剩一对，下轮很可能直接走完。你炸掉 A 的三带二，不是为自己抢牌权，是帮队友挡子弹：A 被炸停，这一圈重新打，队友下手出对子跑了（头游），你保个二游。要是你舍不得炸，A 的三带二没人要，他继续出，很可能一波把你俩都带走。记住：队友能跑就别跟他抢头游，保他跑比你自己冲实在得多。",

{id:25, cat:"残局", title:"剩2张：先出小的诱敌",
 bg:"残局。你剩 2 张：单3和级牌2。对手A剩 4 张。轮到你领出。级牌是2。",

 why:"剩两张一小一大，先出小的。对手看你出 3，心想「他剩的肯定也是小牌」，就敢用 A 来占便宜——没想到你剩的是级牌 2，一把反杀；他剩 4 张里除非有王，否则管不住你的 2，你出完最后一张直接跑了。反过来你先出 2：对手直接用大王管，你剩个 3，他随便出张单张你都接不住，必输。顺序一反，生死两重天。这叫藏大牌：先示弱，让对手先犯错。",

{id:26, cat:"残局", title:"帮队友顶：拆对A保他",

 answer:0,
 why:"队友只剩 1 张，这是全场最关键的时刻：对手这手 K 没人压，他拿牌权继续出，很可能一波跑完。你必须拆对 A 顶住——A 比 K 大，这手 K 被拦下，牌权没丢。拆对 A 看着心疼，但队友下轮出完最后 1 张就是头游，你保个二游；你要是放过去，对手一波走完，你哭都来不及。这叫帮队友顶：他剩 1 张时，你的大单就是他的保镖。",

{id:27, cat:"残局", title:"剩两对：先小后大",

 tip:"两对先小后大"},
{id:28, cat:"中盘", title:"三不带：专打他没有的",
 bg:"中盘。对手A剩 7 张，刚才连续用对子跑牌，手风很顺。轮到你领出，你手里有三张3。",
 table:"对手A剩7张，连续用对子跑牌。轮到你领出。",
 hand:["♠3","♥3","♣3","♠5","♥9","♦J","♣Q","♥Q"],

{id:29, cat:"特殊", title:"取大优先：这张配牌当几？",

 why:"双下升 3 级。从 K 往上数：K→A 是 1 级，A→过 A 是第 2 级——第 2 级你们就已经打赢整局了（先过 A 的队伍获胜），第 3 级都用不上。所以打 K 时把对手双下，等于直接抬走。记住：级别越高，双下越致命；打 K、打 A 时，宁可自己不抢头游，也要先保不被双下。",
 tip:"打K双下直接赢"},
{id:31, cat:"开局", title:"对子先行：手里对子多怎么开？",
 bg:"首攻。你理完牌：对子多（44、77、JJ），单张只有 3、5 两张小的。级牌是2。",
 table:"首攻，桌面无牌。",
 hand:["♠4","♥4","♣7","♦7","♠J","♥J","♠3","♥5","♣9"],
 options:[
  {label:"出对44探路", play:["♠4","♥4"]},
  {label:"出单张 ♠3 探路", play:["♠3"]},
  {label:"出对JJ抢攻", play:["♠J","♥J"]}],
 answer:0,
 why:"首攻一般小单探路，但打法要看牌型：你对子多（44、77、JJ）、单张少，就该「对子先行」。出小对 44：对手想压就得交大对子（逼他交大）；没人压你继续出 77、JJ，一路把对子走完，节奏全在你手里。你那两张小单 3、5 反而要留着——后面顺牌、送队友都靠它们。记住：手里什么牌型多，就用什么牌型开路。",
 tip:"对子多就对子先行"},
{id:32, cat:"残局", title:"逼炸：让他不炸亏、炸了更亏",
 bg:"残局。你手里有大顺子 10-A 和四张7的炸弹，还有张单3。对手A剩 4 张，很可能小炸弹蹲着等你先炸。",
 table:"对手A报剩4张。轮到你领出。",
 hand:["♠10","♥J","♣Q","♦K","♠A","♣7","♥7","♦7","♠7","♣3"],
 options:[
  {label:"出大顺子 10-A 逼他", play:["♠10","♥J","♣Q","♦K","♠A"]},
  {label:"先炸一手，再出顺子", play:["♣7","♥7","♦7","♠7"]},
  {label:"出单张 ♣3 试探", play:["♣3"]}],
 answer:0,
 why:"对手剩 4 张，大概率小炸弹蹲着等你。你直接炸：7777 要是比他的小，白给；比他大，赢了也是浪费——他还没被逼出来，下一圈照样能炸你。你出大顺子 10-A：他炸，你就用 7777 反杀，牌权回到你手里；他不炸，你 5 张顺子直接走掉，剩的牌也好走了。怎么算都是你赚。这叫逼炸：出他「不炸就亏、炸了更亏」的牌，逼他的炸弹现形。",
 tip:"大牌逼炸再反杀"}];
</script>
<script>
"use strict";
var KOUJUE_HTML = ""
+"<div class='koujue'><h4>组牌篇</h4><ol>"
+"<li>组牌第一目标：<b>手数尽量少</b>，单牌越少越好。</li>"
+"<li>红桃配优先级：<b>按炸弹大小配</b>（同花顺 &gt; 五张炸 &gt; 四张炸，能配大的别配小的）→ 再补顺子/三带二缺口；<b>别单出、别叠炸</b>（已有四炸就别再组第二个）。</li>"
+"<li><b>三不拆</b>：王炸、大顺子、强对子，拆了多半后悔。</li>"
+"<li><b>有打有收</b>：打出去的牌型，手里要有更大的能收回来；收不回来就先留着。</li>"
+"<li>组顺子优先<b>去掉小单张</b>；<b>钢板留大不留小</b>。</li>"
+"<li>牌型要灵活，<b>善于变牌型</b>：别因为牌整齐就舍不得变。</li>"
+"</ol></div>"
+"<div class='koujue'><h4>出牌篇</h4><ol>"
+"<li>首攻<b>小单张探路</b>（倒数第二小的单更佳）；情况不明<b>对子先行</b>。</li>"
+"<li><b>两个小单张，不打不健康</b>：别留两个小单在手里，尽早处理。</li>"
+"<li><b>小顺先出、大顺留后</b>，等对手的小顺子「自投罗网」；出完顺子<b>留对子防一手</b>。</li>"
+"<li>封对手的顺子要<b>封到头</b>，别给他留念想。</li>"
+"<li>「三不带」可以<b>搞破坏</b>；对手连续出对子，<b>三带二压他</b>最难受。</li>"
+"<li><b>拆对手牌型</b>也是防守：他出过 7-10 的顺子，你出单张 8，他以后想组顺子就得拆别的牌来补。</li>"
+"<li>牌差就<b>搅局</b>：小单逼他交 A/2，小对逼他拆大对；<b>不抢出牌权</b>，大牌留着帮队友挡。</li>"
+"</ol></div>"
+"<div class='koujue'><h4>炸弹篇</h4><ol>"
+"<li><b>时机比大小重要</b>：四头炸用对时机能赢八头炸。</li>"
+"<li>头火（较早的炸弹）<b>炸上不炸下</b>；主攻炸下家、助攻炸上家。</li>"
+"<li>对手连续用同一牌型跑牌、己方都要不起 → <b>趁早炸</b>，拉回自己的节奏。</li>"
+"<li>残局对手剩4张<b>慎炸</b>（防四张炸）；7张可炸、8张慎炸，但<b>该炸还要炸</b>。</li>"
+"<li>小炸诱敌、大炸开道；<b>骑马火压火</b>（用刚好大一点的炸压）。</li>"
+"<li>该拆就拆：小牌卡手时，<b>拆小炸解套</b>比供着强；但对手连续出小牌「示弱」时，警惕<b>炸弹陷阱</b>，先别交炸。</li>"
+"<li>炸完要<b>控牌型</b>，别送对手顺手的牌。</li>"
+"</ol></div>"
+"<div class='koujue'><h4>残局篇（对手剩N张，你出牌）</h4><ol>"
+"<li><b>4张→打单</b>（防炸弹、不喂对子）；<b>5张→考虑炸+出对</b>；<b>6张→打三张</b>。</li>"
+"<li><b>7/8张→打顺</b>；<b>9张→打单</b>；<b>10张→打对</b>。</li>"
+"<li>自己剩3张：<b>出两张、留一张</b>（先出对子，留单张等队友送）。</li>"
+"<li>自己剩 2 张（一大一小）：<b>先出小的诱敌</b>，藏大牌收尾。</li>"
+"<li>对手剩1张：用<b>最大单张顶死</b>，绝不能放。</li>"
+"<li>残局先拿小牌<b>逼一逼</b>，逼对手提前交炸弹。</li>"
+"</ol></div>"
+"<div class='koujue'><h4>配合篇</h4><ol>"
+"<li><b>一主一跟从</b>：开局先定位，弱牌就当辅助保对家；<b>两人都不冲，上游要落空</b>——定了主攻就别摇摆。</li>"
+"<li><b>不压队友的牌</b>；自己管不上就让给对家。</li>"
+"<li>队友剩少张 → <b>送他缺的同类型牌</b>（渴了送水）；对家炸完，赶紧<b>送最小的对子</b>帮他脱手。</li>"
+"<li>队友在拼命，你要<b>留后劲</b>；队友能跑就<b>让他游</b>，别抢。</li>"
+"<li>牌再差，目标也是<b>不被双下</b>，少让对手升级。</li>"
+"<li>记住：<b>配合比个人牌技重要</b>，对家赢了才算赢。</li>"
+"</ol></div>"
+"<div class='koujue'><h4>记牌篇</h4><ol>"
+"<li><b>必记</b>：王、级牌、红桃配；<b>重点记</b>：K、A。</li>"
+"<li>心里估算<b>炸弹数量</b>：出了几个、还剩几个。</li>"
+"<li>注意<b>断张</b>：某张牌自己一张没有，对手很可能有炸弹。</li>"
+"<li><b>5/10/K 是顺子的枢纽</b>：牌面见多张 5、10、K，对手很难再有长顺。</li>"
+"<li>留意<b>对家缺门</b>：他缺什么牌型，送牌时心里有数。</li>"
+"<li><b>炸弹数学</b>：一局一般 3～4 个炸；见过三个炸，后面基本没炸，大胆冲。</li>"
+"<li>红桃配迟迟不出要警惕：很可能已经配成了<b>炸弹或同花顺</b>。</li>"
+"</ol></div>";
/* ---------- 渲染与交互 ---------- */
var store = {
  get:function(){ try{ return JSON.parse(localStorage.getItem("gdschool-v1")||"{}"); }catch(e){ return {}; } },
  set:function(d){ localStorage.setItem("gdschool-v1", JSON.stringify(d)); }
};
var state = {scn:{}};
(function(){ var s = store.get(); if(s.scn) state.scn=s.scn; })();
var curCat = "全部";
var CATS = ["全部","开局","中盘","残局","特殊"];
var CAT_DESC = {"开局":"首攻出什么、开局怎么定位","中盘":"记牌判断、拆牌博弈、炸弹时机","残局":"剩几张怎么打、配合收尾","特殊":"逢人配、进贡、升级等规则应用"};
function catCount(c){ return SCENARIOS.filter(function(s){ return s.cat===c; }).length; }
function $(id){ return document.getElementById(id); }
function renderChips(){
  $("catChips").innerHTML = CATS.map(function(c){
    var label = (c==="全部" ? "全部 "+SCENARIOS.length : c+" "+catCount(c));
    return '<button data-c="'+c+'" class="'+(c===curCat?"on":"")+'">'+label+'</button>';
  }).join("");
  var btns = document.querySelectorAll("#catChips button");
  for(var i=0;i<btns.length;i++){
    btns[i].onclick = function(){ curCat = this.getAttribute("data-c"); renderChips(); renderScn(); };
  }
}
function updateProg(){
  var ids = Object.keys(state.scn), total = SCENARIOS.length;
  var correct = ids.filter(function(id){ return state.scn[id]===1; }).length;
  $("progText").textContent = "已答 "+ids.length+"/"+total+" · 答对 "+correct;
  $("progBar").style.width = (ids.length/total*100)+"%";
}
function optHTML(o, i){
  var mini = "";
  if(o.play && o.play.length){
    mini = '<span class="mini">'+o.play.map(function(s){ return cardHTML(parseCard(s)); }).join("")+"</span>";
  }
  return '<button class="opt" data-i="'+i+'"><span class="tag">'+o.label+'</span>'+mini+'</button>';
}
function findScn(id){ for(var i=0;i<SCENARIOS.length;i++) if(SCENARIOS[i].id===id) return SCENARIOS[i]; return null; }
function revealScn(box, s, pick, silent){
  var btns = box.querySelectorAll(".opt");
  for(var i=0;i<btns.length;i++){
    btns[i].disabled = true;
    if(i===s.answer) btns[i].classList.add(silent?"reveal-correct":"picked-correct");
    else if(i===pick) btns[i].classList.add("picked-wrong");
  }
  var ex = box.querySelector(".explain");
  var good = (pick===s.answer);
  ex.innerHTML = '<div class="verdict '+(good?"good":"bad")+'">'+(good?"✓ 答对了":"✗ 答错了")+'</div>'
    +"<div>"+s.why+"</div>"
    +'<div><span class="tip">要点：'+s.tip+"</span></div>";
  ex.classList.add("show");
}
function scnCard(s){
  var n = SCENARIOS.indexOf(s)+1;
  var tablePlay = "";
  if(s.tablePlay){
    tablePlay = '<div style="margin-top:6px"><div class="hand">'
      + s.tablePlay.map(function(x){ return cardHTML(parseCard(x)); }).join("")+"</div></div>";
  }
  var handBlock = s.hand.length ? '<div class="hand-label">你的手牌</div>'+handHTML(s.hand) : "";
  return '<div class="scn" data-id="'+s.id+'">'
    +'<h3><span class="cat">'+s.cat+"</span>第"+n+"题 · "+s.title+"</h3>"
    +'<div class="bg">'+s.bg+"</div>"
    +'<div class="table-line">桌面：'+s.table+tablePlay+"</div>"
    +handBlock
    +'<div class="opts">'+s.options.map(optHTML).join("")+"</div>"
    +'<div class="explain"></div>'
    +"</div>";
}
function renderScn(){
  var cats = (curCat==="全部") ? ["开局","中盘","残局","特殊"] : [curCat];
  var html = "";
  for(var ci=0; ci<cats.length; ci++){
    var c = cats[ci];
    var items = SCENARIOS.filter(function(s){ return s.cat===c; });
    html += '<div class="cathead"><b>'+c+'</b><span>'+CAT_DESC[c]+'</span><i>'+items.length+'题</i></div>';
    html += items.map(scnCard).join("");
  }
  $("scnList").innerHTML = html;
  var boxes = document.querySelectorAll("#scnList .scn");
  for(var k=0;k<boxes.length;k++){
    (function(box){
      var id = +box.getAttribute("data-id");
      var s = findScn(id);
      var btns = box.querySelectorAll(".opt");
      if(state.scn[id]!==undefined){
        revealScn(box, s, state.scn[id]===1 ? s.answer : -2, true);
      }
      for(var i=0;i<btns.length;i++){
        btns[i].onclick = function(){
          if(state.scn[id]!==undefined) return;
          var pick = +this.getAttribute("data-i");
          state.scn[id] = (pick===s.answer)?1:0;
          store.set(state);
          revealScn(box, s, pick, false);
          updateProg();
        };
      }
    })(boxes[k]);
  }
}
var tabBtns = document.querySelectorAll("nav.tabs button");
for(var ti=0; ti<tabBtns.length; ti++){
  tabBtns[ti].onclick = function(){
    for(var j=0;j<tabBtns.length;j++) tabBtns[j].classList.remove("on");
    this.classList.add("on");
    var panels = document.querySelectorAll(".panel");
    for(var p=0;p<panels.length;p++) panels[p].classList.remove("on");
    $("p-"+this.getAttribute("data-p")).classList.add("on");
    window.scrollTo(0,0);
  };
}
$("resetBtn").onclick = function(){ state.scn={}; store.set(state); renderScn(); updateProg(); };
$("p-koujue").innerHTML = KOUJUE_HTML;
renderChips(); renderScn(); updateProg();
</script>
</body>
</html>
