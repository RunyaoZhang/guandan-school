<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>掼蛋学堂 · 情景实战教学</title>
<style>
:root{
  --paper:#f5efe2; --paper2:#efe6d2; --ink:#2c2620; --ink-soft:#5c544a;
  --red:#b03a2e; --gold:#a87f2a; --green:#3c5a4a; --line:#d8cbaa;
  --card-bg:#fffdf7; --good:#2e7d4f; --bad:#b03a2e;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:"Songti SC","STSong","Noto Serif SC",serif; line-height:1.7;}
.wrap{max-width:760px; margin:0 auto; padding:0 14px 80px;}
header.top{text-align:center; padding:26px 10px 10px;}
header.top h1{margin:0; font-size:30px; letter-spacing:6px;}
header.top h1 .seal{display:inline-block; background:var(--red); color:#fdf8ec; font-size:15px;
  letter-spacing:2px; padding:3px 8px; border-radius:4px; vertical-align:middle; margin-left:8px;}
header.top p{margin:8px 0 0; color:var(--ink-soft); font-size:14px;}
nav.tabs{position:sticky; top:0; z-index:50; background:var(--paper); border-bottom:2px solid var(--line);
  display:flex; margin:14px -14px 0; padding:0 14px;}
nav.tabs button{flex:1; border:none; background:none; font-family:inherit; font-size:16px;
  padding:12px 4px; color:var(--ink-soft); border-bottom:3px solid transparent; cursor:pointer;}
nav.tabs button.on{color:var(--red); border-bottom-color:var(--red); font-weight:700;}
.panel{display:none; padding-top:16px;}
.panel.on{display:block;}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 12px;}
.chips button{border:1px solid var(--line); background:var(--card-bg); border-radius:20px;
  padding:5px 14px; font-family:inherit; font-size:14px; color:var(--ink-soft); cursor:pointer;}
.chips button.on{background:var(--green); border-color:var(--green); color:#f7f3e8;}
.progress{display:flex; align-items:center; gap:10px; font-size:14px; color:var(--ink-soft); margin:6px 0 14px;}
.progress .bar{flex:1; height:8px; background:var(--paper2); border-radius:4px; overflow:hidden;}
.progress .bar i{display:block; height:100%; background:var(--green); width:0; transition:width .3s;}
.progress button{border:1px solid var(--line); background:none; border-radius:6px; font-size:12px;
  color:var(--ink-soft); padding:3px 10px; font-family:inherit; cursor:pointer;}
.scn{background:var(--card-bg); border:1px solid var(--line); border-radius:10px;
  padding:16px 14px; margin-bottom:16px; box-shadow:0 1px 3px rgba(60,40,20,.06);}
.scn h3{margin:0 0 4px; font-size:17px;}
.scn h3 .cat{font-size:12px; color:var(--green); border:1px solid var(--green); border-radius:4px;
  padding:1px 7px; margin-right:8px; vertical-align:2px; font-weight:400;}
.scn .bg{font-size:14.5px; color:var(--ink); margin:8px 0;}
.scn .table-line{font-size:14px; background:var(--paper2); border-radius:8px; padding:8px 10px; margin:8px 0;}
.legend{font-size:13.5px; color:var(--ink); background:var(--paper2); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:8px 12px; margin:10px 0;}
.scn .table-line b{color:var(--red);}
.hand-label{font-size:13px; color:var(--ink-soft); margin:10px 0 6px;}
.hand{display:flex; flex-wrap:wrap; gap:6px;}
.card{width:46px; height:62px; background:#fff; border:1px solid #c9bfa8; border-radius:7px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-weight:700; box-shadow:0 1px 2px rgba(0,0,0,.08); position:relative;}
.card .r{font-size:17px; line-height:1.1; font-family:Georgia,serif;}
.card .s{font-size:14px; line-height:1.2;}
.card.red{color:#c0392b;} .card.black{color:#2c2c34;}
.card.joker{background:linear-gradient(160deg,#3a3a44,#23232b); color:#f5d67b; border-color:#555;}
.card.joker .r{font-size:15px;}
.card.wild{border:2px solid var(--gold); box-shadow:0 0 0 1px var(--gold);}
.card.wild::after{content:"配"; position:absolute; top:-9px; right:-7px; background:var(--gold);
  color:#fff; font-size:10px; width:17px; height:17px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;}
.opts{margin-top:12px; display:flex; flex-direction:column; gap:8px;}
.opt{border:1.5px solid var(--line); background:#fff; border-radius:9px; padding:9px 12px;
  font-family:inherit; font-size:15px; text-align:left; cursor:pointer; color:var(--ink);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.opt .tag{flex:1; min-width:120px;}
.opt .mini{display:flex; gap:4px; flex-wrap:wrap;}
.opt .mini .card{width:34px; height:46px;}
.opt .mini .card .r{font-size:13px;} .opt .mini .card .s{font-size:11px;}
.opt .mini .card.joker .r{font-size:11px;}
.opt.picked-correct{border-color:var(--good); background:#eef7f0;}
.opt.picked-wrong{border-color:var(--bad); background:#fbeeec;}
.opt.reveal-correct{border-color:var(--good); background:#eef7f0;}
.opt:disabled{cursor:default; opacity:.95;}
.meta{margin-top:6px; font-size:14px; background:#f4efe4; border-left:3px solid var(--gold); padding:6px 10px; border-radius:0 8px 8px 0;}
.meta b{color:var(--red); margin-right:6px;}
.layer{margin-top:8px; padding-top:8px; border-top:1px dashed var(--line);}
.layer b{color:var(--green);}
.confl{margin-top:8px; font-size:13px; color:#8a7a5c;}
.confl b{color:#8a6d2f;}
.explain{display:none; margin-top:12px; border-top:1px dashed var(--line); padding-top:12px; font-size:14.5px;}
.explain.show{display:block;}
.explain .verdict{font-weight:700; font-size:16px; margin-bottom:6px;}
.explain .verdict.good{color:var(--good);} .explain .verdict.bad{color:var(--bad);}
.explain .tip{margin-top:10px; display:inline-block; background:var(--green); color:#f7f3e8;
  font-size:13px; border-radius:5px; padding:2px 10px;}
/* v3: 高级题状态条 */
.statusbar{margin:8px 0; font-size:13.5px; background:#f8f4e9; border:1px solid var(--line); border-radius:8px; padding:8px 10px;}
.srow{display:flex; align-items:center; gap:6px; margin:3px 0; flex-wrap:wrap;}
.srow1{gap:8px;}
.stars{color:var(--gold); letter-spacing:2px; font-size:14px;}
.qtag{font-size:12px; border:1px solid var(--green); color:var(--green); border-radius:4px; padding:0 6px;}
.ctag{font-size:12px; border-radius:4px; padding:1px 8px; color:#f7f3e8;}
.ctag.rule{background:var(--good);}
.ctag.preferred{background:var(--green);}
.ctag.risky{background:#c26a1b;}
.ctag.insufficient{background:var(--gold);}
.slabel{color:var(--red); font-weight:700; min-width:36px;}
.seat{border:1px solid var(--line); background:#fff; border-radius:5px; padding:0 8px; font-size:13px;}
.seat.me{background:var(--green); color:#f7f3e8; border-color:var(--green); font-weight:700;}
.sarr{color:var(--ink-soft);}
.histmore{display:inline;}
.histmore summary{display:inline; cursor:pointer; color:var(--green); font-size:13px;}
/* v3: 顺子区间表 */
.intervals{margin:8px 0; display:flex; flex-direction:column; gap:5px;}
.iv{display:flex; align-items:center; gap:8px; font-size:13.5px; background:#fff; border:1px solid var(--line); border-radius:6px; padding:5px 10px;}
.iv b{font-family:Georgia,serif; letter-spacing:1px; min-width:70px;}
.iv span{font-size:12px; border-radius:4px; padding:0 8px; color:#f7f3e8;}
.iv i{color:var(--ink-soft); font-style:normal; font-size:12.5px;}
.iv-ok span{background:var(--good);}
.iv-warn span{background:var(--gold);}
.iv-out{opacity:.75;} .iv-out span{background:#9a917f;}
/* v3: 八块解析 */
.concl{border-radius:8px; padding:10px 12px; margin-bottom:8px; border-left:5px solid;}
.concl b{font-size:16px;}
.concl-sub{font-size:13.5px; margin-top:4px; color:var(--ink);}
.concl.preferred{background:#e9f4ec; border-color:var(--good);}
.concl.rule{background:#e9f4ec; border-color:var(--good);}
.concl.risky{background:#fdf0e2; border-color:#c26a1b;}
.concl.insufficient{background:#fdf6e3; border-color:var(--gold);}
.ablock{margin-top:8px; padding:8px 10px; background:#fff; border:1px solid var(--line); border-radius:0 8px 8px 0; border-left:4px solid var(--green);}
.ablock b{color:var(--green); display:block; margin-bottom:2px; font-size:14px;}
.ablock.worst{border-left-color:var(--bad);} .ablock.worst b{color:var(--bad);}
.ablock.rev{border-left-color:var(--gold);} .ablock.rev b{color:#8a6d2f;}
.oppview{margin-top:8px; background:#f1ede2; border-radius:8px; padding:10px 12px;}
.oppview b{display:block; color:var(--ink); font-size:14px; margin-bottom:2px;}
.explain .verdict.warn{color:#c26a1b;}
.deep{margin-top:8px; font-size:13.5px;} .deep summary{cursor:pointer; color:var(--green);}
/* v3: followUp 二阶段 */
.fuwrap{margin-top:12px; border-top:1px dashed var(--line); padding-top:10px;}
.fubtn{background:var(--green); color:#f7f3e8; border:none; border-radius:8px; padding:8px 18px; font-size:14px; cursor:pointer; font-family:inherit;}
.fureveal{background:#fdf6e3; border-left:4px solid var(--gold); border-radius:0 8px 8px 0; padding:8px 12px; margin-bottom:8px; font-size:14.5px;}
.fuq{font-weight:700; font-size:15.5px; margin:6px 0;}
.fuwhy{margin-top:8px; font-size:14.5px;}

.rule-sec{background:var(--card-bg); border:1px solid var(--line); border-radius:10px;
  padding:16px; margin-bottom:14px;}
.rule-sec h3{margin:0 0 8px; font-size:17px; color:var(--red);}
.rule-sec table{width:100%; border-collapse:collapse; font-size:14px;}
.rule-sec td,.rule-sec th{border:1px solid var(--line); padding:6px 8px; text-align:left;}
.rule-sec th{background:var(--paper2); font-weight:600;}
.rule-sec ul{margin:6px 0; padding-left:20px; font-size:14.5px;}
.rule-sec li{margin-bottom:6px;}
.koujue{background:var(--card-bg); border:1px solid var(--line); border-radius:10px;
  padding:14px 16px; margin-bottom:12px;}
.koujue h4{margin:0 0 6px; color:var(--green); font-size:16px;}
.koujue ol{margin:0; padding-left:22px; font-size:14.5px;}
.koujue li{margin-bottom:5px;}
.koujue li b{color:var(--red);}
.koujue .say{display:block; color:var(--ink-soft); font-size:13px; margin-top:3px; line-height:1.6;}
.cathead{display:flex; align-items:baseline; gap:8px; margin:20px 0 10px; padding:9px 14px;
 background:var(--green); color:#f7f3e8; border-radius:8px;}
.cathead b{font-size:16px; letter-spacing:2px;}
.cathead span{font-size:12.5px; opacity:.85; flex:1;}
.cathead i{font-style:normal; font-size:12.5px; opacity:.85;}
.foot-note{font-size:13px; color:var(--ink-soft); text-align:center; margin-top:24px;}
.quiz-q{font-size:16px; font-weight:700; margin:10px 0 4px;}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <h1>掼蛋学堂<span class="seal">实战教学</span></h1>
  <p>两副牌 · 四人对战 · 从2打到A —— 先看情景，再选出牌，答完立刻告诉你为什么</p>
</header>
<nav class="tabs">
  <button data-p="scn" class="on">情景实战</button>
  <button data-p="adv">高手进阶</button>
  <button data-p="koujue">实战口诀</button>
</nav>
<section class="panel on" id="p-scn">
  <div class="chips" id="catChips"></div>
  <div class="legend">读解析时分两层看：<b>规则</b>是硬性的（牌型合不合法、大小关系）；<b>建议</b>是常见打法，结合记牌和局势判断，不是每次都对的铁律。</div>
  <div class="progress">
    <span id="progText">已答 0/20</span>
    <div class="bar"><i id="progBar"></i></div>
    <button id="resetBtn">重置</button>
  </div>
  <div id="scnList"></div>
</section>
<section class="panel" id="p-adv">
  <div class="legend">进阶题每道都带<b>座次、剩牌、记牌、牌路</b>——先看条件再选。结论分<b>当前更优 / 规则确定 / 高风险 / 信息不足</b>，不是非黑即白。解析含：你的目标、对手最优回应、队友影响、你的下一手、最坏情况、<b>答案反转条件</b>、对手视角。记住：条件一变，答案可能就变。</div>
  <div class="progress">
    <span id="advProgText"></span>
    <div class="bar"><i id="advProgBar"></i></div>
    <button id="resetBtn2">重置</button>
  </div>
  <div id="advList"></div>
</section>
<section class="panel" id="p-koujue"></section>
<div class="foot-note">题目按官方比赛规则与常见实战打法编写，级牌统一按「打2」举例。<br>规则会因地方玩法略有差异，记住大逻辑最重要。</div>
</div>
<script>
"use strict";
var RANK_ORDER = {"3":3,"4":4,"5":5,"6":6,"7":7,"8":8,"9":9,"10":10,"J":11,"Q":12,"K":13,"A":14,"2":15,"小王":16,"大王":17};
function parseCard(s){
  var wild = s.charAt(s.length-1) === "※";
  if(wild) s = s.slice(0,-1);
  if(s==="大王"||s==="小王") return {rank:s, joker:true, wild:false};
  return {suit:s.charAt(0), rank:s.slice(1), joker:false, wild:wild};
}
function cardHTML(c){
  if(c.joker) return '<span class="card joker"><span class="r">'+c.rank+'</span><span class="s">王</span></span>';
  var red = (c.suit==="♥"||c.suit==="♦");
  return '<span class="card '+(red?"red":"black")+(c.wild?" wild":"")+'"><span class="r">'+c.rank+'</span><span class="s">'+c.suit+'</span></span>';
}
function handHTML(hand){
  var cs = hand.map(parseCard).sort(function(a,b){
    var d=(RANK_ORDER[a.rank]||0)-(RANK_ORDER[b.rank]||0); if(d) return d;
    return String(a.suit||"").localeCompare(String(b.suit||""));
  });
  return '<div class="hand">'+cs.map(cardHTML).join("")+"</div>";
}
</script>
<script>
"use strict";
var SCENARIOS = [
{id:2, cat:"开局", title:"逢人配：这张万能牌怎么用？",
 bg:"理牌阶段。级牌是2，你手里有一张红桃2——也就是「逢人配」（万能牌，除王之外可配成任意牌型）。",
 table:"理牌中，还没出牌。",
 hand:["♠3","♥3","♦3","♥2※","♥5","♥6","♥7","♥8","♠8","♥8","♠4","♣7","♠K","♥K","小王"],
 options:[
  {label:"用红桃2配成 3333 四炸", play:["♠3","♥3","♦3","♥2※"]},
  {label:"把红桃2当单张2直接出掉", play:["♥2※"]},
  {label:"用红桃2配成同花顺 ♥5-9", play:["♥5","♥6","♥7","♥8","♥2※"]},
  {label:"用红桃2配成 333 带一对8（三带二）", play:["♠3","♥3","♥2※","♠8","♥8"]}],
 answer:2,
 why:"按炸弹大小：<b>同花顺 &gt; 五张炸弹 &gt; 四张炸弹</b>。你手里的 ♥5-8 是同花连张，配上红桃2就是同花顺 ♥5-9——比四张3的炸弹大得多（四炸是最小的炸弹，只能炸普通牌型）。逢人配的原则是配出<b>尽可能大的牌型</b>，而不是无脑配四炸。当然，如果配同花顺会拆散你已有的大牌型，那就另当别论——结合整手牌判断。绝不能单出当 2 用，等于把万能牌当普通牌扔掉。",
 tip:"逢人配配最大牌型"},
{id:3, cat:"开局", title:"拆还是不拆：四个J的烦恼",
 bg:"中盘。对手刚才出了一对10，你的下家（队友）没要，轮到你。你的手牌很散：有四个J的炸弹，却还有 3、4、6 三张小单和一对7卡在手里。",
 table:"对手出 <b>对10</b>，队友没要。",
 tablePlay:["♠10","♥10"],
 hand:["♠J","♥J","♣J","♦J","♣3","♠4","♥6","♣7","♦7","♠K","小王"],
 options:[
  {label:"留着四个J，先出单张 ♣3", play:["♣3"]},
  {label:"拆四个J成两对JJ，用一对JJ压住对10", play:["♠J","♥J"]},
  {label:"直接用四个J炸掉对10", play:["♠J","♥J","♣J","♦J"]}],
 answer:1,
 why:"四个J留到最后，大概率被更大的炸弹（四个2、王炸）压死，而你的 3、4、6、77 这些小牌会全部烂在手里。拆小炸解套是高手常用手法：用 JJ 压住对10抢到牌权，顺手还能把对 77 带走——把「死牌」盘活，比供着一个用不出去的炸弹实在得多。记住：炸弹是拿来用的，不是拿来供的。",
 tip:"该拆就拆"},
{id:4, cat:"开局", title:"有打有收：顺子先出吗？",
 bg:"你首攻。手里有个顺子 5-9，但你没有任何大牌能确保把这个顺子「收」回来（没人压你才能继续出牌）。",
 table:"首攻，桌面无牌。",
 hand:["♠5","♥6","♣7","♦8","♠9","♣6","♦6","♠8","♥8","♣3","♥7","大王"],
 options:[
  {label:"先出顺子 5-9", play:["♠5","♥6","♣7","♦8","♠9"]},
  {label:"先出单张 ♣3", play:["♣3"]},
  {label:"先出大王抢牌权", play:["大王"]}],
 answer:1,
 why:"出牌原则「有打有收」：打出去的牌型，手里最好有更大的牌能收回来，否则等于白送牌权。5-9 这个顺子你收不回来，先出了就是帮别人送出牌权。正确打法是先出小单张探路，把顺子留着——等对手出了小顺子，你再压上去，这叫「等对方自投罗网」。",
 tip:"有打有收"},
{id:5, cat:"中盘", title:"队友的对J，压不压？",
 bg:"你的对家（队友）出了一对J，上家对手没要，下家对手也没要，轮到你。你手里有对Q、对K。",
 table:"队友出 <b>对J</b>，两家对手都没要。",
 tablePlay:["♠J","♥J"],
 hand:["♠Q","♥Q","♣K","♦K","♠3","♥5","♣9","♠9","♦9","小王"],
 options:[
  {label:"出对Q压上去", play:["♠Q","♥Q"]},
  {label:"出对K压上去", play:["♣K","♦K"]},
  {label:"过，让队友继续出", play:[]}],
 answer:2,
 why:"队友出的牌，只要对手不要，你一般就不压——这是掼蛋配合的一条重要原则。压队友的牌等于帮对手省大牌、断队友的节奏。你的对Q、对K要留着去压对手的对子，这才叫配合。记住：顺牌不挡对家路。",
 tip:"不压队友的牌"},
{id:6, cat:"中盘", title:"对手连出三手顺子，炸不炸？",
 bg:"对手A已经连续出了三手顺子（5-9、6-10、7-J），你和队友都要不起。A 剩 8 张，眼看就要跑完了。你手里有四个9的炸弹。",
 table:"对手A出 <b>顺子 7-J</b>，报剩8张。",
 tablePlay:["♠7","♥8","♣9","♦10","♠J"],
 hand:["♠9","♥9","♣9","♦9","♠6","♥6","♥J","♦J","♣3","♠4","大王"],
 options:[
  {label:"继续忍，等A出完再说", play:[]},
  {label:"果断炸掉，抢回牌权出自己的对子", play:["♠9","♥9","♣9","♦9"]},
  {label:"出单张 ♣3 干扰一下", play:["♣3"]}],
 answer:1,
 why:"对方连续用同一牌型跑牌、己方都要不起时，炸得越早损失越小——等他把顺子跑完再炸，黄花菜都凉了。炸完之后出你擅长的对子，把节奏拉回自己的赛道。记住：炸弹的时机比大小重要得多，四头炸用对时机能赢八头炸。",

<script>
"use strict";
var KOUJUE_HTML = ""
+"<div class='koujue'><h4>组牌篇</h4><ol>"
+"<li><b>组牌第一目标</b>：<b>手数尽量少</b>，单牌越少越好。<span class=\"say\">说人话：一副牌分几手打完，基本决定你第几名。理牌先数“我要几手”，单牌多就并进顺子、三带二里，能少一手是一手。</span></li>"
+"<li><b>红桃配优先级</b>：<b>通常按炸弹大小配</b>（同花顺 &gt; 五张炸 &gt; 四张炸，能配大的别配小的）→ 再补顺子/三带二缺口；<b>别单出、别叠炸</b>。<span class=\"say\">说人话：红桃2是万能牌，好钢用在刀刃上：先看能不能配成大炸弹，配不成再补顺子的缺口。单出一张等于白扔；已经有四炸了还组第二个，不如一个大炸顶用。</span></li>"
+"<li><b>三不拆</b>：王炸、大顺子、强对子，拆了多半后悔。<span class=\"say\">说人话：这是你手里最硬的三样东西，拆了它们去凑别的，等于把长城拆了砌猪圈，拆完多半拍大腿。</span></li>"
+"<li><b>有打有收</b>：打出去的牌型，手里要有更大的能收回来；收不回来就先留着。<span class=\"say\">说人话：出牌前先问自己一句：人家压回来，我拿什么压回去？拿得回来再出，拿不回来就先捂着，不然等于白送一圈出牌权。</span></li>"
+"<li><b>组顺去小单</b>：组顺子优先<b>去掉小单张</b>；<b>钢板通常留大不留小</b>。<span class=\"say\">说人话：顺子是处理小单张最好的垃圾桶，小单塞进顺子就不用一张张出了。两副钢板只能留一副时留大的——小的早晚被压，大的还能当家。</span></li>"
+"<li><b>善于变牌型</b>：牌型要灵活，别因为牌整齐就舍不得变。<span class=\"say\">说人话：别跟自己的牌型谈恋爱。局势变了（比如顺子走不通了），就拆了重组；死抱着“整齐”不放，整齐是给你对手看的。</span></li>"
+"</ol></div>"
+"<div class='koujue'><h4>出牌篇</h4><ol>"
+"<li><b>首攻探路</b>：首攻<b>小单张</b>探路；出哪张小单，看你是想<b>清僵单</b>还是<b>卡下家</b>（见“高手进阶”第1、2题）。<span class=\"say\">说人话：第一手别急着交大牌型，先扔张小单张探探路：看看各家要不要、谁强谁弱。出最小的还是稍大的，要看局势：你牌弱、以后难拿牌权，就先清自己的僵单；你牌强、有大牌兜底，就先卡下家的小牌。没有固定的“第几小”，只有合不合局势。</span></li>"
+"<li><b>小单别攒</b>：<b>两个小单张，不打不健康</b>：通常别留两个小单在手里，尽早处理。<span class=\"say\">说人话：手里攒两个小单等于攒两个累赘，越到残局越出不去。早点想办法处理掉（塞进顺子或早点出），别留着过年。</span></li>"
+"<li><b>小顺先出</b>：<b>小顺先出、大顺留后</b>，等对手的小顺子“自投罗网”；出完顺子<b>留对子防一手</b>。<span class=\"say\">说人话：小顺子先扔出去探路，大顺子捂着——对手看你出了小顺，以为顺子安全了，再出他的小顺，正好撞你枪口上。出完顺子手里留对子，是防对手反手出对子你没招。</span></li>"
+"<li><b>封顺封到头</b>：封对手的顺子要<b>封到头</b>，别给他留念想。<span class=\"say\">说人话：压对手顺子要用最大的顺子一次压死。压个不大不小的，他下轮换个更大的顺子又来了，等于白压。</span></li>"
+"<li><b>三不带搞破坏</b>：「三不带」可以<b>搞破坏</b>；对手连续出对子，<b>三带二通常压他</b>最难受。<span class=\"say\">说人话：对手正出对子出得爽，你突然甩个三不带，他手里没三张就只能干瞪眼。他老出对子，你就用三带二压——三带二里自带一对，专治对子。</span></li>"
+"<li><b>拆对手牌型</b>：他爱走顺子，你就领出 8 这样的中段单张，逼他交 9、10、J 来抢——那正是他组顺子要用的牌。<span class=\"say\">说人话：他抢这一圈，就废了以后的顺子；他不抢，你继续领出。一张 8 两头堵，他怎么选都难受。</span></li>"
+"<li><b>牌差就搅局</b>：小单逼他交 A/2，小对逼他拆大对；<b>不抢出牌权</b>，大牌留着帮队友挡。<span class=\"say\">说人话：牌烂就别想自己跑，改当搅局的：小单逼他用 A、2 来管，小对逼他拆大对子——他的大牌用一张少一张，队友后面就好打了。你的大牌别乱管，留着关键时刻帮队友挡子弹。</span></li>"
+"</ol></div>"
+"<div class='koujue'><h4>炸弹篇</h4><ol>"
+"<li><b>时机第一</b>：<b>时机比大小重要</b>：四头炸用对时机能赢八头炸。<span class=\"say\">说人话：炸弹不是比谁大，是比谁炸得是时候。对手要一波跑完时你扔个四炸，顶他八个炸憋到最后没处扔。会炸不如会等。</span></li>"
+"<li><b>炸弹分工</b>：头火（较早的炸弹）<b>通常炸上不炸下</b>；主攻炸下家、助攻炸上家。<span class=\"say\">说人话：早用的炸弹去炸上家——上家压着你，炸他等于给自己松绑；下家是你的出牌方向，别炸他，留着让他给你“送牌”。主攻的人堵下家（对手），助攻的人看住上家（保队友）。</span></li>"
+"<li><b>趁早炸</b>：对手连续用同一牌型跑牌、己方都要不起 → <b>趁早炸</b>，拉回自己的节奏。<span class=\"say\">说人话：对手用同一招连着跑牌、你们俩都管不上了，别犹豫，炸！越晚炸他跑得越多，趁他刚起势掐断，把节奏抢回来。</span></li>"
+"<li><b>慎炸与该炸</b>：残局对手剩4张<b>慎炸</b>（防四张炸）；7张可炸、8张慎炸，但<b>该炸还要炸</b>。<span class=\"say\">说人话：对手剩 4 张很可能就是四张炸，你一炸正好撞枪口，所以要慎重。但“慎”不是“不敢”：他眼看要跑完了，你有炸就得炸，不能因为怕就放他走。</span></li>"
+"<li><b>大小炸分工</b>：小炸诱敌、大炸开道；<b>骑马火压火</b>（用刚好大一点的炸压）。<span class=\"say\">说人话：小炸弹别供着，拿它去引对手的大炸弹出来；真要冲刺时用大炸弹开路，一炸定音。压别人的炸弹时，用刚好大一点的就行——别拿八炸去压四炸，浪费。</span></li>"
+"<li><b>拆炸与陷阱</b>：小牌卡手时<b>拆小炸解套</b>比供着强；但对手连续出小牌“示弱”时，警惕<b>炸弹陷阱</b>，先别交炸。<span class=\"say\">说人话：小单张卡得你出不了牌，拆个小炸弹带走它们，比留着炸弹、单张全烂手里强。但反过来：对手连续出小牌、你出大他都不要，别以为他弱——他可能在诱你出大牌再一炸收你，这时候炸弹先捂着。</span></li>"
+"<li><b>炸完控牌</b>：炸完要<b>控牌型</b>，别送对手顺手的牌。<span class=\"say\">说人话：炸完出牌权是你的，别乱出一手让对手舒服的牌（比如他刚出完对子你又出对子）。出他难受的牌型，把主动权用到底。</span></li>"
+"</ol></div>"
+"<div class='koujue'><h4>残局篇（对手剩N张，你出牌）</h4><ol>"
+"<li><b>4/5/6张</b>：<b>没信息时的默认动作</b>：4张→打单；5张→考虑炸+出对；6张→打三张。<b>有牌路信息时，牌路优先</b>。<span class=\"say\">说人话：这组数字是“啥都不知道时”的保底打法：剩 4 张怕小炸就打单；剩 5 张怕一波流就考虑炸；剩 6 张打三张施压。但如果你看过他的牌路（比如他一直在走对子），那 5 张更可能是两对+一单，就别套口诀了——信息永远比口诀准。</span></li>"
+"<li><b>7/8/9/10张</b>：<b>没信息时的默认动作</b>：7张→打顺；8张→防顺；9张→打单；10张→打对。<b>有牌路信息时，牌路优先</b>。<span class=\"say\">说人话：这组也是保底打法：剩 7 张像顺子你就抢顺子；剩 8 张防一手大顺子；剩 9 张单张稳；剩 10 张对子施压。但记住——这都是“常见情况”，看到他的真实牌路后，一切以牌路为准。</span></li>"
+"<li><b>剩3张</b>：自己剩3张：<b>通常出两张、留一张</b>（先出对子，留单张等队友送）。<span class=\"say\">说人话：剩一对加一单，先把两张的出了，留一张单——因为队友最容易送你的是单张。你留一张单，队友下轮送个小单你就跑了；反过来先出单留一对，队友想送你都送不上。</span></li>"
+"<li><b>剩2张</b>：自己剩 2 张（一大一小）：<b>通常先出小的诱敌</b>，藏大牌收尾。<span class=\"say\">说人话：一大一小两张，先出小的。对手看你出小牌，以为你没货了，敢拿 A 来占便宜——没想到你藏了张大的，一把反杀。你先出大的，他拿王一压，你剩张小的必死。</span></li>"
+"<li><b>剩1张</b>：对手剩1张：用<b>最大单张顶死</b>，绝不能放。<span class=\"say\">说人话：他只剩一张了，你手里最大的单张必须毫不犹豫拍出去。这是最后一道门，你放过去他就跑了，没第二次机会。</span></li>"
+"<li><b>残局逼炸</b>：残局先拿小牌<b>逼一逼</b>，逼对手提前交炸弹。<span class=\"say\">说人话：残局别急着交大牌，先拿小牌去探：他要是交炸弹来压，你就知道他有炸了，后面好防；他不交，你小牌还走掉了，怎么都不亏。</span></li>"
+"</ol></div>"
+"<div class='koujue'><h4>配合篇</h4><ol>"
+"<li><b>一主一跟从</b>：开局先定位，弱牌就当辅助保对家；<b>两人都不冲，上游要落空</b>——定了主攻就别摇摆。<span class=\"say\">说人话：开局先看牌说话：牌弱就认命当辅助，别跟主攻的队友抢出牌权。但两个人里必须有一个冲——两个都不敢上，对手就白捡上游了。定了谁主攻就一条道走到黑。</span></li>"
+"<li><b>不压队友</b>：<b>不压队友的牌</b>；自己管不上就让给对家。<span class=\"say\">说人话：队友出的牌，能让就让。你压了他的牌，等于帮对手干活——牌权丢了不说，队友还得重新组织。管不上就过，让队友继续出。</span></li>"
+"<li><b>渴了送水</b>：队友剩少张 → <b>送他缺的同类型牌</b>；对家炸完，赶紧<b>送最小的对子</b>帮他脱手。<span class=\"say\">说人话：队友剩几张跑不掉时，看他缺啥送啥——他老出单张，你就送单张，这叫“渴了送水”。他刚交完炸弹手里空了，你赶紧送最小的对子帮他脱手，别让他攒着小牌等死。</span></li>"
+"<li><b>留后劲</b>：队友在拼命，你要<b>留后劲</b>；队友能跑就<b>让他游</b>，别抢。<span class=\"say\">说人话：队友正在跟对手拼命，你别把大牌全交了，留点后劲给他擦屁股。他要是能跑了，你就别抢着出大牌——让他先走（头游），你保个二游，双赢。</span></li>"
+"<li><b>不被双下</b>：牌再差，目标也是<b>不被双下</b>，少让对手升级。<span class=\"say\">说人话：牌烂到赢不了也别摆烂，底线是别让对手包揽三、四名——双下对手升 3 级，亏大了。保一个是一个。</span></li>"
+"<li><b>配合第一</b>：记住：<b>配合比个人牌技重要</b>，对家赢了才算赢。<span class=\"say\">说人话：掼蛋是两个人的游戏，你一个人牌再好，队友被双下了也白搭。多想想怎么帮队友，少想想怎么自己耍帅。</span></li>"
+"</ol></div>"
+"<div class='koujue'><h4>记牌篇</h4><ol>"
+"<li><b>记什么</b>：<b>必记</b>：王、级牌、红桃配；<b>重点记</b>：K、A。<span class=\"say\">说人话：不用记 108 张，就记这几张：王和级牌是最大的单张，红桃配是万能牌——这三样决定谁说了算。K、A 是仅次于它们的硬牌，记住了就知道什么时候该压、什么时候该让。</span></li>"
+"<li><b>数炸弹</b>：别只数出了几个，要算<b>炸弹候选集合</b>：哪种点数还够 4 张、王炸还组不组成。<span class=\"say\">说人话：光数“出了几个炸”没用——两副牌加逢人配，炸弹数量波动很大。真正要算的是余量：比如 9 只剩 1 张了，四张9 就不可能了；小王出完了，王炸就组不成了。余量见底，才是你大胆冲的信号。</span></li>"
+"<li><b>断张</b>：注意<b>断张</b>：某张牌自己一张没有，对手很可能有炸弹。<span class=\"say\">说人话：某张牌你手里一张没有、牌面也没见过，别以为它消失了——它很可能四张凑一桌，在某人手里当炸弹蹲着你呢。</span></li>"
+"<li><b>顺子枢纽</b>：<b>5/10/K 是顺子的枢纽</b>（初级记法）；想更准，用<b>区间排除法</b>（见高手进阶）。<span class=\"say\">说人话：5、10、K 是顺子最常经过的三张，记住它们能帮你大致判断。但别把它当铁律——真正准的办法是把能压你的每个更大顺子区间一个一个排除（比如 9 见底了，所有经过 9 的顺子都不可能）。初级记枢纽，高级数区间。</span></li>"
+"<li><b>对家缺门</b>：留意<b>对家缺门</b>：他缺什么牌型，送牌时心里有数。<span class=\"say\">说人话：注意队友从来不出哪类牌（比如他从没出过对子），那可能就是他的缺门。你送牌时避开他的缺门，送他有的，他才接得住。</span></li>"
+"<li><b>炸弹数学</b>：别迷信“3、4 个炸”：<b>数余量</b>，余量见底再大胆冲。<span class=\"say\">说人话：“一局就 3、4 个炸”是最害人的口诀——两副牌加逢人配，炸多炸少全看命。靠谱的办法还是数余量：哪种点数已经不可能成炸了，一个一个划掉。划到没剩几种，你再冲。</span></li>"
+"<li><b>红桃配警惕</b>：红桃配迟迟不出要警惕：很可能已经配成了<b>炸弹或同花顺</b>。<span class=\"say\">说人话：红桃 2 是万能牌，谁都不舍得早出。如果有人到中盘了还没出过红桃 2，很可能已经配成炸弹或同花顺了——你出大牌时心里要有这根弦。</span></li>"
+"</ol></div>";

var CATS = ["全部","开局","中盘","残局","特殊"];
var CAT_DESC = {"开局":"首攻出什么、开局怎么定位","中盘":"记牌判断、拆牌博弈、炸弹时机","残局":"剩几张怎么打、配合收尾","特殊":"逢人配、进贡、升级等规则应用"};
function catCount(c){ return SCENARIOS.filter(function(s){ return s.cat===c; }).length; }
function $(id){ return document.getElementById(id); }
function renderChips(){
  $("catChips").innerHTML = CATS.map(function(c){
    var label = (c==="全部" ? "全部 "+SCENARIOS.filter(function(s){return s.cat!=="进阶";}).length : c+" "+catCount(c));

  }).join("");
  var btns = document.querySelectorAll("#catChips button");

  }
}
function updateProg(){
  function prog(ids, total, txtEl, barEl, name){
    var correct = ids.filter(function(id){ return state.scn[id]===1; }).length;
    $(txtEl).textContent = name+"已答 "+ids.length+"/"+total+" · 答对 "+correct;
    $(barEl).style.width = (total? ids.length/total*100 : 0)+"%";
  }
  var baseIds = Object.keys(state.scn).filter(function(id){ var s=findScn(+id); return s && s.cat!=="进阶"; });
  var advIds = Object.keys(state.scn).filter(function(id){ var s=findScn(+id); return s && s.cat==="进阶"; });
  var baseTotal = SCENARIOS.filter(function(s){ return s.cat!=="进阶"; }).length;
  var advTotal = SCENARIOS.filter(function(s){ return s.cat==="进阶"; }).length;
  prog(baseIds, baseTotal, "progText", "progBar", "");
  prog(advIds, advTotal, "advProgText", "advProgBar", "");
}
function optHTML(o, i){
  var mini = "";
  if(o.play && o.play.length){
    mini = '<span class="mini">'+o.play.map(function(s){ return cardHTML(parseCard(s)); }).join("")+"</span>";
  }
  return '<button class="opt" data-i="'+i+'"><span class="tag">'+o.label+'</span>'+mini+'</button>';
}
function findScn(id){ for(var i=0;i<SCENARIOS.length;i++) if(SCENARIOS[i].id===id) return SCENARIOS[i]; return null; }

function seatName(id){ return {you:"你",partner:"队友",enemyA:"敌A",enemyB:"敌B"}[id]||id; }
var KC_LABEL = {bigJokerSeen:["大王",2],smallJokerSeen:["小王",2],aceSeen:["A",8],kingSeen:["K",8],queenSeen:["Q",8],jackSeen:["J",8],tenSeen:["10",8],nineSeen:["9",8],levelSeen:["级牌",8],wildSeen:["逢人配",2]};
function keyCountsText(kc){
  return Object.keys(kc).map(function(k){
    var L = KC_LABEL[k]||[k,"?"];
    return L[0]+"已出"+kc[k]+"/"+L[1];
  }).join(" · ");
}
function certLabel(c){ return {rule:"规则确定",preferred:"当前更优",risky:"高风险",insufficient:"信息不足"}[c]||"当前更优"; }
function statusBarHTML(s){
  var h = "";
  var d = s.difficulty||3;
  var stars = "★★★★★".slice(0,d)+"☆☆☆☆☆".slice(0,5-d);
  h += '<div class="srow srow1"><span class="stars">'+stars+'</span>'
    + (s.qtype?'<span class="qtag">'+s.qtype+'</span>':"")
    + '<span class="ctag '+(s.certainty||"preferred")+'">'+certLabel(s.certainty)+'</span></div>';
  if(s.seats && s.seats.length && typeof s.seats[0]==="string" && isNaN(+s.seats[0].charAt(0))){
    var seq = s.seats.map(function(id){ return '<span class="seat'+(id==="you"?" me":"")+'">'+seatName(id)+'</span>'; }).join('<span class="sarr">→</span>');
    h += '<div class="srow"><span class="slabel">座次</span>'+seq+'</div>';
  }
  if(s.remaining){
    var r = s.remaining;
    h += '<div class="srow"><span class="slabel">剩牌</span><span>你'+r.you+'｜队友'+r.partner+'｜敌A'+r.enemyA+'｜敌B'+r.enemyB+'</span></div>';
  }
  if(s.tableText) h += '<div class="srow"><span class="slabel">桌面</span><span>'+s.tableText+'</span></div>';
  if(s.keyCounts) h += '<div class="srow"><span class="slabel">记牌</span><span>'+keyCountsText(s.keyCounts)+'</span></div>';
  if(s.history && s.history.length){
    var first2 = s.history.slice(0,2).join("；");
    var rest = s.history.slice(2);
    h += '<div class="srow"><span class="slabel">牌路</span><span>'+first2
      + (rest.length? ' <details class="histmore"><summary>展开全部'+s.history.length+'条</summary><div>'+rest.join("；")+'</div></details>' : '')
      + '</span></div>';
  }
  if(s.intervals){
    h += '<div class="intervals">'+s.intervals.map(function(iv){
      var cls = {possible:"iv-ok",reduced:"iv-warn",excluded:"iv-out"}[iv.st];
      var txt = {possible:"仍可能",reduced:"概率下降",excluded:"基本排除"}[iv.st];
      return '<div class="iv '+cls+'"><b>'+iv.r+'</b><span>'+txt+'</span><i>'+iv.note+'</i></div>';
    }).join("")+'</div>';
  }
  return '<div class="statusbar">'+h+'</div>';
}
function verdictHTML(s, good){
  var cert = s.certainty||"preferred";
  if(good){
    if(cert==="rule") return '<div class="verdict good">✓ 答对了</div>';
    var label = {preferred:"当前更优",risky:"高风险",insufficient:"信息不足，暂选"}[cert];
    var cls = (cert==="preferred")?"good":"warn";
    return '<div class="verdict '+cls+'">'+label+'：'+(s.recText||"")+'</div>';
  }
  if(cert==="rule") return '<div class="verdict bad">✗ 答错了</div>';
  return '<div class="verdict bad">这个选择不太好，再看看解析</div>';
}
function advExplainHTML(s){
  var cert = s.certainty||"preferred";
  var h = '<div class="concl '+cert+'"><b>'+certLabel(cert)+'：'+(s.recText||"")+'</b>'
    + (s.explanationShort?'<div class="concl-sub">'+s.explanationShort+'</div>':"")+'</div>';
  function block(title, body, cls){
    if(!body) return "";
    return '<div class="ablock '+(cls||"")+'"><b>'+title+'</b><div>'+body+'</div></div>';
  }
  h += block("你的目标", s.objective);
  h += block("对手最优回应", s.opponentResponse);
  h += block("队友影响", s.partnerImpact);
  h += block("你的下一手", s.nextStep);
  h += block("最坏情况", s.worstCase, "worst");
  h += block("答案反转条件", s.reverseCondition, "rev");
  if(s.opponentView) h += '<div class="oppview"><b>如果我是对手，我最希望你出什么？</b><div>'+s.opponentView+'</div></div>';
  if(s.explanationDeep) h += '<details class="deep"><summary>再深一层</summary><div>'+s.explanationDeep+'</div></details>';
  if(s.tip) h += '<div><span class="tip">要点：'+s.tip+'</span></div>';
  return h;
}
function followUpHTML(s){
  if(!s.followUps || !s.followUps.length) return "";
  return '<div class="fuwrap"><button class="fubtn">再给我一条信息</button><div class="fubody" style="display:none"></div></div>';
}
function bindFollowUp(box, s){
  var wrap = box.querySelector(".fuwrap");
  if(!wrap || !s.followUps) return;
  var idx = 0;
  function showNext(btn){
    if(idx >= s.followUps.length){ btn.style.display="none"; return; }
    var fu = s.followUps[idx];
    var body = wrap.querySelector(".fubody");
    body.innerHTML = '<div class="fureveal">再给你一条信息：'+fu.reveal+'</div>'
      + '<div class="fuq">'+fu.question+'</div>'
      + '<div class="opts">'+fu.options.map(function(o,i){ return '<button class="opt fuopt" data-i="'+i+'"><span class="tag">'+o+'</span></button>'; }).join("")+'</div>'
      + '<div class="fuwhy"></div>';
    body.style.display = "block";
    btn.style.display = "none";
    var opts = body.querySelectorAll(".fuopt");
    for(var k=0;k<opts.length;k++){
      opts[k].onclick = function(){
        var pick = +this.getAttribute("data-i");
        for(var j=0;j<opts.length;j++){
          opts[j].disabled = true;
          if(j===fu.answer) opts[j].classList.add("picked-correct");
          else if(j===pick) opts[j].classList.add("picked-wrong");
        }
        var ok = (pick===fu.answer);
        body.querySelector(".fuwhy").innerHTML = '<div class="verdict '+(ok?"good":"bad")+'">'+(ok?"✓ 判断正确":"再想想")+'</div><div>'+fu.why+'</div>';
        idx++;
        if(idx < s.followUps.length){
          var nb = document.createElement("button");
          nb.className = "fubtn"; nb.textContent = "再给我一条信息";
          nb.onclick = function(){ showNext(nb); };
          body.appendChild(nb);
        }
      };
    }
  }
  wrap.querySelector(".fubtn").onclick = function(){ showNext(this); };
}

function revealScn(box, s, pick, silent){
  var btns = box.querySelectorAll(".opt");
  for(var i=0;i<btns.length;i++){
    btns[i].disabled = true;
    if(i===s.answer) btns[i].classList.add(silent?"reveal-correct":"picked-correct");
    else if(i===pick) btns[i].classList.add("picked-wrong");
  }
  var ex = box.querySelector(".explain");
  var good = (pick===s.answer);
  if(s.objective){
    ex.innerHTML = verdictHTML(s, good) + advExplainHTML(s) + followUpHTML(s);
  } else {
    ex.innerHTML = '<div class="verdict '+(good?"good":"bad")+'">'+(good?"✓ 答对了":"✗ 答错了")+'</div>'
      +"<div>"+s.why+"</div>"
      +(s.alt?'<div class="layer"><b>为什么其他选项不优：</b>'+s.alt+"</div>":"")
      +(s.flip?'<div class="layer"><b>什么时候答案会反转：</b>'+s.flip+"</div>":"")
      +(s.conf?'<div class="confl">判断可信度：<b>'+s.conf+"</b></div>":"")
      +'<div><span class="tip">要点：'+s.tip+"</span></div>";
  }
  ex.classList.add("show");
  bindFollowUp(box, s);
}
function metaHTML(s){
  var h = "";
  if(s.seats) h += '<div class="meta"><b>座次</b>'+s.seats+'</div>';
  if(s.left) h += '<div class="meta"><b>剩牌</b>'+s.left+'</div>';
  if(s.keys) h += '<div class="meta"><b>已出关键牌</b>'+s.keys+'</div>';
  if(s.hist) h += '<div class="meta"><b>已知牌路</b>'+s.hist+'</div>';
  return h;
}
function scnCard(s, label){
  var tablePlay = "";
  if(s.tablePlay){
    tablePlay = '<div style="margin-top:6px"><div class="hand">'
      + s.tablePlay.map(function(x){ return cardHTML(parseCard(x)); }).join("")+"</div></div>";
  }
  var handBlock = s.hand.length ? '<div class="hand-label">你的手牌</div>'+handHTML(s.hand) : "";
  return '<div class="scn" data-id="'+s.id+'">'
    +'<h3><span class="cat">'+s.cat+"</span>"+label+" · "+s.title+"</h3>"
    +'<div class="bg">'+s.bg+"</div>"
    +'<div class="table-line">桌面：'+s.table+tablePlay+"</div>"
    +(s.difficulty?statusBarHTML(s):metaHTML(s))
    +handBlock
    +'<div class="opts">'+s.options.map(optHTML).join("")+"</div>"
    +'<div class="explain"></div>'
    +"</div>";
}
function bindBoxes(containerId){
  var boxes = document.querySelectorAll("#"+containerId+" .scn");
  for(var k=0;k<boxes.length;k++){
    (function(box){
      var id = +box.getAttribute("data-id");
      var s = findScn(id);
      var btns = box.querySelectorAll(".opt");
      if(state.scn[id]!==undefined){
        revealScn(box, s, state.scn[id]===1 ? s.answer : -2, true);
      }
      for(var i=0;i<btns.length;i++){
        btns[i].onclick = function(){
          if(state.scn[id]!==undefined) return;
          var pick = +this.getAttribute("data-i");
          state.scn[id] = (pick===s.answer)?1:0;
          store.set(state);
          revealScn(box, s, pick, false);
          updateProg();
        };
      }
    })(boxes[k]);
  }
}
function renderScn(){
  var cats = (curCat==="全部") ? ["开局","中盘","残局","特殊"] : [curCat];
  var html = "";
  for(var ci=0; ci<cats.length; ci++){
    var c = cats[ci];
    var items = SCENARIOS.filter(function(s){ return s.cat===c; });
    html += '<div class="cathead"><b>'+c+'</b><span>'+CAT_DESC[c]+'</span><i>'+items.length+'题</i></div>';
    html += items.map(function(s, i){ return scnCard(s, "第"+(i+1)+"题"); }).join("");
  }
  $("scnList").innerHTML = html;
  bindBoxes("scnList");
}
function renderAdv(){
  var items = SCENARIOS.filter(function(s){ return s.cat==="进阶"; });
  var html = '<div class="cathead"><b>高手进阶</b><span>条件一变答案就变：座次、剩牌、记牌、牌路综合判断</span><i>'+items.length+'题</i></div>';
  html += items.map(function(s, i){ return scnCard(s, "第"+(i+1)+"题"); }).join("");
  $("advList").innerHTML = html;
  bindBoxes("advList");
}
var tabBtns = document.querySelectorAll("nav.tabs button");
for(var ti=0; ti<tabBtns.length; ti++){
  tabBtns[ti].onclick = function(){
    for(var j=0;j<tabBtns.length;j++) tabBtns[j].classList.remove("on");
    this.classList.add("on");
    var panels = document.querySelectorAll(".panel");
    for(var p=0;p<panels.length;p++) panels[p].classList.remove("on");
    $("p-"+this.getAttribute("data-p")).classList.add("on");
    window.scrollTo(0,0);
  };
}
$("resetBtn").onclick = function(){ state.scn={}; store.set(state); renderScn(); renderAdv(); updateProg(); };
$("resetBtn2").onclick = function(){ state.scn={}; store.set(state); renderScn(); renderAdv(); updateProg(); };
$("p-koujue").innerHTML = KOUJUE_HTML;
renderChips(); renderScn(); renderAdv(); updateProg();
</script>
